name: minimax-h3-dgx-spark

services:
  minimax-h3:
    build:
      context: .
      args:
        BASE_IMAGE: vllm/vllm-omni:minimax-h3@sha256:e930db8e225162d01e17a49dddc43fd0e844208908d8356a028e5c4e7357696e
    image: minimax-h3-dgx-spark:sm121-fp8
    container_name: minimax-h3-fl2va
    restart: "no"
    network_mode: host
    ipc: host
    shm_size: "8gb"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_OMNI_VIDEO_SYNC_TIMEOUT: ${H3_VIDEO_SYNC_TIMEOUT:-7200}
      # Bounds only the background D2H/SHM copy of a finished step (normally
      # milliseconds). Upstream's 30 s was tripped by 48 s/step runs, which
      # cancelled the output future mid-flight. See patches/apply-result-pump-hotfix.py
      H3_ASYNC_OUTPUT_TIMEOUT: ${H3_ASYNC_OUTPUT_TIMEOUT:-900}
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      HF_HOME: /root/.cache/huggingface
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      H3_BIND_HOST: ${H3_BIND_HOST:-127.0.0.1}
      H3_API_PORT: ${H3_API_PORT:-8000}
      H3_ALLOW_REMOTE_API: ${H3_ALLOW_REMOTE_API:-false}
      VLLM_API_KEY: ${H3_API_KEY:-}
      H3_DIFFUSION_ATTENTION_BACKEND: ${H3_DIFFUSION_ATTENTION_BACKEND:-CUDNN_ATTN}
      H3_EXECUTION_MODE: ${H3_EXECUTION_MODE:-compile}
      H3_CACHE_BACKEND: ${H3_CACHE_BACKEND:-none}
      H3_CACHE_CONFIG: ${H3_CACHE_CONFIG:-}
    volumes:
      - ${MINIMAX_H3_MODEL_DIR:?Set MINIMAX_H3_MODEL_DIR in .env}:/models/MiniMax-H3/FL2VA:ro
      - ${HF_CACHE_DIR:?Set HF_CACHE_DIR in .env}:/root/.cache/huggingface
      - ./output:/output
