name: minimax-h3-dgx-spark

services:
  minimax-h3:
    build:
      context: .
      args:
        BASE_IMAGE: vllm/vllm-omni:minimax-h3@sha256:e930db8e225162d01e17a49dddc43fd0e844208908d8356a028e5c4e7357696e
    image: minimax-h3-dgx-spark:sm121-fp8
    container_name: minimax-h3-rig
    restart: "no"
    network_mode: host
    ipc: host
    shm_size: "8gb"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_OMNI_VIDEO_SYNC_TIMEOUT: ${H3_VIDEO_SYNC_TIMEOUT:-7200}
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      HF_HOME: /root/.cache/huggingface
      HUMMING_CACHE_DIR: /root/.cache/minimax-h3-kernels/humming
      TRITON_CACHE_DIR: /root/.cache/minimax-h3-kernels/triton
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/minimax-h3-kernels/torchinductor
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      H3_BIND_HOST: ${H3_BIND_HOST:-127.0.0.1}
      H3_API_PORT: ${H3_API_PORT:-8000}
      H3_ALLOW_REMOTE_API: ${H3_ALLOW_REMOTE_API:-false}
      VLLM_API_KEY: ${H3_API_KEY:-}
      H3_DIFFUSION_ATTENTION_BACKEND: ${H3_DIFFUSION_ATTENTION_BACKEND:-CUDNN_ATTN}
      H3_EXECUTION_MODE: ${H3_EXECUTION_MODE:-compile}
      H3_CACHE_BACKEND: ${H3_CACHE_BACKEND:-none}
      H3_CACHE_CONFIG: ${H3_CACHE_CONFIG:-}
      H3_LINEAR_BACKEND: ${H3_LINEAR_BACKEND:-CUTLASS}
      H3_STARTUP_WARMUP: ${H3_STARTUP_WARMUP:-true}
      H3_RIG_MODE: ${H3_RIG_MODE:-fl2va}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://$${H3_BIND_HOST}:$${H3_API_PORT}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15m
    volumes:
      - ${MINIMAX_H3_MODEL_ROOT:?Set MINIMAX_H3_MODEL_ROOT in .env}:/models/MiniMax-H3:ro
      - ${MINIMAX_H3_LORA_ROOT:?Set MINIMAX_H3_LORA_ROOT in .env}:/models/loras:ro
      - ${HF_CACHE_DIR:?Set HF_CACHE_DIR in .env}:/root/.cache/huggingface
      - h3-kernel-cache:/root/.cache/minimax-h3-kernels
      - ./output:/output

volumes:
  h3-kernel-cache:
